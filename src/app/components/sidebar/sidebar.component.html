<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Example</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen flex">
        <!-- Sidebar -->
        <div class="w-64 bg-white shadow-md">
            
            <div class="px-4">
                <div class="flex items-center p-4 mb-4 bg-gray-100 rounded-lg">
                    <img class="w-12 h-12 rounded-full" src="/assets/logo.png" alt="User">
                    <div class="ml-4">
                        <p class="text-gray-800 font-semibold">Ecomm Visual</p>
                        <p class="text-gray-600 text-sm">3.09K Followers</p>
                    </div>
                </div>
                <div class="font-semibold text-gray-500 pb-5">GENERAL </div>
                <nav class="space-y-2">
                    <a href="#" class="flex items-center p-2 text-gray-600 bg-gray-100 rounded-lg">
                        <span class="material-icons-outlined text-xl">dashboard</span>
                        <span class="ml-3">Dashboard</span>
                        <span class="ml-auto">D</span>
                    </a>
                    <a href="#" class="flex items-center p-2 text-gray-600 hover:bg-gray-100 rounded-lg">
                        <span class="material-icons-outlined text-xl">shopping_cart</span>
                        <span class="ml-3">Orders</span>
                    </a>
                    <a href="#" class="flex items-center p-2 text-gray-600 hover:bg-gray-100 rounded-lg">
                        <span class="material-icons-outlined text-xl">inventory</span>
                        <span class="ml-3">Products</span>
                    </a>
                    <a href="#" class="flex items-center p-2 text-gray-600 hover:bg-gray-100 rounded-lg">
                        <span class="material-icons-outlined text-xl">analytics</span>
                        <span class="ml-3">Analytics</span>
                    </a>
                    <a href="#" class="flex items-center p-2 text-gray-600 hover:bg-gray-100 rounded-lg">
                        <span class="material-icons-outlined text-xl">message</span>
                        <span class="ml-3">Messages</span>
                    </a>
                    <div class="font-semibold text-gray-500">HELP & SETTINGS</div>
                    <div class="pt-2 ">
                        <a href="#" class="flex items-center p-2 text-gray-600 hover:bg-gray-100 rounded-lg">
                            <span class="material-icons-outlined text-xl">support_agent</span>
                            <span class="ml-3 ">Customer support</span>
                        </a>
                        <a href="#" class="flex items-center p-2 text-gray-600 hover:bg-gray-100 rounded-lg">
                            <span class="material-icons-outlined text-xl">settings</span>
                            <span class="ml-3">Settings</span>
                        </a>
                    </div>
                </nav>
            </div>
           <div class="image-edit">
            <img src="/assets/shoppingbag.jpg">
           </div> 
           <div class="font-bold pl-4">Upgrade your plan to unlock</div>
           <div class="text-1xl pl-4">You are now using free version</div>


        
        </div>
    </div>
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
</body>
</html>
