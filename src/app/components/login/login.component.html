<div class="min-h-screen flex items-center justify-center bg-gray-100">
    <div class="bg-white p-8 rounded-lg shadow-lg w-96">
      <h2 class="text-2xl font-bold mb-6 text-center">Login</h2>
      <form (ngSubmit)="onLogin()">
        <div class="mb-4">
          <label for="username" class="block text-gray-700">Username</label>
          <input id="username" type="text" [(ngModel)]="username" name="username" class="w-full px-3 py-2 border rounded-lg" required>
        </div>
        <div class="mb-4">
          <label for="password" class="block text-gray-700">Password</label>
          <input id="password" type="password" [(ngModel)]="password" name="password" class="w-full px-3 py-2 border rounded-lg" required>
        </div>
        <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-lg">Login</button>
        <button (click)="goToPage('user')" class="underline text-blue-500 hover:text-blue-900">new user</button>
      </form>
    </div>

    
  </div>
